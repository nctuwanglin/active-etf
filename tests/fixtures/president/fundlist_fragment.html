;,&quot;dOnLineDate&quot;:null,&quot;dOffLineDate&quot;:null,&quot;sFundTypeID&quot;:null,&quot;sFundFile&quot;:null,&quot;sKeyword&quot;:null,&quot;sDescr&quot;:null,&quot;mDescription&quot;:null,&quot;iUserID&quot;:null,&quot;bDisable&quot;:0,&quot;bDelete&quot;:0,&quot;tCreateTime&quot;:&quot;2024-03-08T17:37:51.033&quot;,&quot;tLastTime&quot;:&quot;2031-07-30T23:59:00&quot;,&quot;sTitle&quot;:null,&quot;sLogan&quot;:&quot;（本基金並無保證收益及配息，配息來源可能為收益平準金）&quot;,&quot;mIndexFeature&quot;:&quot;本指數特選臺灣高息動能指數為客製化及 Smart Beta(單因子/多因子)指數，係以臺灣上市上櫃股票為母體，自發行市值及自由流通市值前 250 大股票中，經流動性檢驗、股利發放率、營業利益率等指標篩選，依配息率擇優選取 40 檔股票。成分股以股利率加權後、結合發行市值及風險調整後報酬配置成分股權重，表彰兼具高股息、成長動能與獲利能力之股票投資組合績效表現。「特選臺灣高息動能指數」於2023/10/30發布，以2023/10/27為基期，基期指數為5,000點。&quot;,&quot;mIndexIntro&quot;:&quot;&lt;table class=\&quot;table table-bordered table-hover table-striped middle\&quot;&gt;\n\t&lt;tbody&gt;\n\t\t&lt;tr&gt;\n\t\t\t&lt;th width=\&quot;20%\&quot;&gt;\n\t\t\t\t指數名稱\n\t\t\t&lt;/th&gt;\n\t\t\t&lt;td width=\&quot;80%\&quot;&gt;\n\t\t\t\t臺灣指數公司特選臺灣上市上櫃高息動能指數&lt;br /&gt;\nTIP Customized Taiwan High Dividend Momentum Index\n\t\t\t&lt;/td&gt;\n\t\t&lt;/tr&gt;\n\t\t&lt;tr&gt;\n\t\t\t&lt;th&gt;\n\t\t\t\t指數編製公司\n\t\t\t&lt;/th&gt;\n\t\t\t&lt;td&gt;\n\t\t\t\t臺灣指數公司\n\t\t\t&lt;/td&gt;\n\t\t&lt;/tr&gt;\n\t\t&lt;tr&gt;\n\t\t\t&lt;th&gt;\n\t\t\t\t成分股篩選準則\n\t\t\t&lt;/th&gt;\n\t\t\t&lt;td&gt;\n\t\t\t\t&lt;ul&gt;\n\t\t\t\t\t&lt;li&gt;\n\t\t\t\t\t\t上市櫃發行市值及自由流通市值前250大股票\n\t\t\t\t\t&lt;/li&gt;\n\t\t\t\t\t&lt;li&gt;\n\t\t\t\t\t\t流動性篩選\n\t\t\t\t\t&lt;/li&gt;\n\t\t\t\t\t&lt;li&gt;\n\t\t\t\t\t\t經流動性篩選後，依財務基本面做基礎篩選，選取通過以下條件，&lt;br /&gt;\n(1) 最近2季每股盈餘總和大於0。&lt;br /&gt;\n(2) 最近3年平均現金股利發放率介於0%與120%之間。&lt;br /&gt;\n(3) 排除最近一季營業利益率之數值及季增率同屬最低30%之股票。&lt;br /&gt;\n(4) 排除定期審核生效日前已除息之年配息股票或宣告不發放現金股利之股票。\n\t\t\t\t\t&lt;/li&gt;\n\t\t\t\t\t&lt;li&gt;\n\t\t\t\t\t\t選取通過上述條件者，股利率前40大之股票建構投資組合。\n\t\t\t\t\t&lt;/li&gt;\n\t\t\t\t\t&lt;li&gt;\n\t\t\t\t\t\t(1) 成分股定期審核(5月)：股利率加權，再依發行市值調整權重。&lt;br /&gt;\n(2) 權重定期審核(1月、9月)：以審核資料日指數成分股權重為基準，再依風險調整後報酬調整權重。\n\t\t\t\t\t&lt;/li&gt;\n\t\t\t\t&lt;/ul&gt;\n\t\t\t&lt;/td&gt;\n\t\t&lt;/tr&gt;\n\t\t&lt;tr&gt;\n\t\t\t&lt;th&gt;\n\t\t\t\t指數調整頻率\n\t\t\t&lt;/th&gt;\n\t\t\t&lt;td&gt;\n\t\t\t\t&lt;ul&gt;\n\t\t\t\t\t&lt;li&gt;\n\t\t\t\t\t\t5月為成分股定審：以5月的第17個交易日為審核基準日，審核資料截至5月的第10個交易日。\n\t\t\t\t\t&lt;/li&gt;\n\t\t\t\t\t&lt;li&gt;\n\t\t\t\t\t\t1月、9月為權重定審：以1月的第7個交易日、9月的第17個交易日為審核基準日，審核資料截至12月最後一個交易日、9月的第10個交易日。\n\t\t\t\t\t&lt;/li&gt;\n\t\t\t\t&lt;/ul&gt;\n\t\t\t&lt;/td&gt;\n\t\t&lt;/tr&gt;\n\t\t&lt;tr&gt;\n\t\t\t&lt;th&gt;\n\t\t\t\t成分股票檔數\n\t\t\t&lt;/th&gt;\n\t\t\t&lt;td&gt;\n\t\t\t\t40檔\n\t\t\t&lt;/td&gt;\n\t\t&lt;/tr&gt;\n\t\t&lt;tr&gt;\n\t\t\t&lt;th&gt;\n\t\t\t\t指數起始日\n\t\t\t&lt;/th&gt;\n\t\t\t&lt;td&gt;\n\t\t\t\t2023/10/27，起始點數為5,000\n\t\t\t&lt;/td&gt;\n\t\t&lt;/tr&gt;\n\t\t&lt;tr&gt;\n\t\t\t&lt;th&gt;\n\t\t\t\t指數投資策略及Smart Beta（單因子/多因子）指數相關風險說明\n\t\t\t&lt;/th&gt;\n\t\t\t&lt;td&gt;\n\t\t\t\t特選臺灣高息動能指數係以配適臺灣除權息周期為核心價值，於臺灣除權息旺季前，綜合考量財務基本面及殖利率進行選股，加權方式採殖利率加權，再依成分股市值調整權重。而於臺灣除權息旺季後，不另重新選股，延續既有投資組合權重分布，依成分股夏普值進行權重加減碼，冀能活化投資組合之配置效率。惟不保證該指數績效在任何時候的表現均優於市場行情，在某些市場環境下，指數績效可能落後市值加權指數或其他績效指標，且這種情況可能持續很長一段時間。且追蹤該指數之ETF，相較於追蹤市值加權指數之ETF，可能有相當比例持股投資於市值較小之公司。\n\t\t\t&lt;/td&gt;\n\t\t&lt;/tr&gt;\n\t\t&lt;tr&gt;\n\t\t\t&lt;th&gt;\n\t\t\t\t是否為客製化指數\n\t\t\t&lt;/th&gt;\n\t\t\t&lt;td&gt;\n\t\t\t\t是\n\t\t\t&lt;/td&gt;\n\t\t&lt;/tr&gt;\n\t\t&lt;tr&gt;\n\t\t\t&lt;th&gt;\n\t\t\t\t客製化指數編製規則及風險特性\n\t\t\t&lt;/th&gt;\n\t\t\t&lt;td&gt;\n\t\t\t\t&lt;a href=\&quot;/docupload/file/20240308/20240308185220_5990.pdf\&quot; target=\&quot;_blank\&quot;&gt;&lt;img width=\&quot;20\&quot; height=\&quot;20\&quot; alt=\&quot;檔案下載\&quot; src=\&quot;/Images/icon33.gif\&quot; /&gt;&amp;nbsp;客製化指數編製規則及風險特性下載&lt;/a&gt; \n\t\t\t&lt;/td&gt;\n\t\t&lt;/tr&gt;\n\t&lt;/tbody&gt;\n&lt;/table&gt;\n&lt;strong&gt;指數成分股定期審查結果&lt;/strong&gt; \n&lt;table class=\&quot;table table-bordered table-hover table-striped middle\&quot;&gt;\n\t&lt;tbody&gt;\n\t\t&lt;tr&gt;\n\t\t\t&lt;th width=\&quot;20%\&quot;&gt;\n\t\t\t\t定審時間\n\t\t\t&lt;/th&gt;\n\t
